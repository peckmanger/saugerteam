# Hält die kostenlose Supabase-Datenbank wach (sie pausiert sonst nach 7 Tagen ohne Aktivität).
name: Supabase wach halten
on:
  schedule:
    - cron: "17 6 */3 * *"   # alle 3 Tage
  workflow_dispatch:          # manuell testen: Actions → "Supabase wach halten" → Run workflow
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kleine Abfrage an die Datenbank
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=name&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}")
          echo "Antwort: $code"
          test "$code" = "200"
