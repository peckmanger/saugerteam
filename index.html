<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#50AE2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Saugerteam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="demo-seed.js"></script>
<style>
:root{
  --accent:#50AE2F; --accent-strong:#3F9122; --accent-weak:rgba(80,174,47,.12); --accent-weak2:rgba(80,174,47,.22);
  --bg:#F6F7F5; --card:#FFFFFF; --text:#16181A; --muted:#6B7177; --faint:#A3A8AD;
  --line:#E6E8E4; --line-strong:#D5D8D2; --chip:#F0F2EE;
  --ok:#50AE2F; --soon:#E3A008; --urgent:#E5484D; --unknown:#C3C7C2;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,16,.04), 0 4px 16px rgba(16,24,16,.04);
  --tabbar-h:64px;
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0F1110; --card:#181B19; --text:#ECEEEB; --muted:#9AA19C; --faint:#6C736E;
    --line:#262A27; --line-strong:#323733; --chip:#212522; --accent-weak:rgba(80,174,47,.16); --accent-weak2:rgba(80,174,47,.28);
    --unknown:#4A504B; --shadow:none; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom))}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
header.top .in{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:17px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand .dot svg{width:16px;height:16px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-size:14px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-weak);color:var(--accent-strong);display:grid;place-items:center;font-weight:650;font-size:12px}
@media (prefers-color-scheme:dark){.avatar{color:var(--accent)}}
.banner{max-width:640px;margin:0 auto 4px;padding:0 16px}
.banner div{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:7px 12px}

h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 4px;font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Buttons & inputs */
.btn{white-space:nowrap;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:550;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--urgent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
label.field{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label.field > span{display:block;margin-bottom:6px}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:10px 12px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea{min-height:110px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;user-select:none}
.check input{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;margin:0;background:var(--card);transition:.15s}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:520;transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.static{cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--accent-weak);color:var(--accent-strong)}
.pill.soon{background:rgba(227,160,8,.14);color:#A87400}
.pill.urgent{background:rgba(229,72,77,.12);color:#C8343A}
.pill.unknown{background:var(--chip);color:var(--muted)}
.pill.plain::before{display:none}
@media (prefers-color-scheme:dark){.pill.ok{color:#7CCB60}.pill.soon{color:#F0BE4A}.pill.urgent{color:#FF7A7E}}

/* Month switcher */
.monthbar{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.monthbar .title{font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1}
.monthbar .title small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11.5px;color:var(--faint);text-align:center;font-weight:600;padding-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.day{aspect-ratio:1/1.05;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:0;font-size:15px;font-weight:560;min-width:0}
.day.off{color:var(--faint);opacity:.55;cursor:default;font-weight:450}
.day.open{background:var(--card);border-color:var(--line-strong)}
.day.open.we{background:var(--chip)}
.day.sel,.day.open.sel,.day.open.we.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.day .meta{font-size:10.5px;font-weight:600;opacity:.75;line-height:1}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.sel .dots i{background:#fff}
.day.planned::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid var(--accent);pointer-events:none}
.day.sel.planned::after{border-color:var(--accent-strong)}
.day.today .num{text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Plan list */
.slot{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.datebox{width:48px;height:52px;border-radius:12px;background:var(--accent-weak);color:var(--accent-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
@media (prefers-color-scheme:dark){.datebox{color:#7CCB60}}
.datebox b{font-size:18px;line-height:1}
.datebox span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.slot .who{font-weight:600}
.slot .who .me-hl{color:var(--accent-strong);background:var(--accent-weak);border-radius:6px;padding:0 5px}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:10px 12px;background:var(--chip);border-radius:12px;margin-top:10px}
.hint b{color:var(--text);font-weight:600}

/* Matrix */
.matrix{overflow-x:auto;margin:0 -16px;padding:0 16px}
.matrix table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.matrix th,.matrix td{padding:6px 4px;text-align:center;white-space:nowrap}
.matrix th{color:var(--muted);font-weight:600}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-right:10px;font-weight:600;z-index:1}
.matrix .y{display:inline-block;width:16px;height:16px;border-radius:5px;background:var(--accent)}
.matrix .n{display:inline-block;width:16px;height:16px;border-radius:5px;background:var(--chip)}
.matrix tr.sum td{font-weight:700;border-top:1px solid var(--line)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:.2s;margin-right:4px}
details.fold[open] summary::after{transform:rotate(-135deg)}

/* Wall */
.wall{width:100%;max-width:420px;display:block;margin:0 auto;touch-action:manipulation}
.wall .seg{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:22;transition:stroke .2s,stroke-width .2s}
.wall .neutral{fill:none;stroke:var(--line-strong);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 26}
.wall .hit{fill:none;stroke:transparent;stroke-width:110;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.wall text{font-size:76px;font-weight:650;fill:var(--text);text-anchor:middle;dominant-baseline:central;cursor:pointer;letter-spacing:-1px}
.wall .lblbg{fill:var(--card);stroke:var(--line);stroke-width:3}
.wall g.sec.sel .lblbg{fill:var(--accent);stroke:var(--accent)}
.wall g.sec.sel text{fill:#fff}
.wall .door{stroke:var(--muted);fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.secrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.secrow:last-child{border-bottom:0}
.secname{font-weight:650;font-size:16px;width:58px;flex:none;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:999px}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.hbar .track{height:10px;background:var(--chip);border-radius:999px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hbar .val{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.hbar.inactive{opacity:.5}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .c i{width:100%;max-width:26px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:2px}
.cols .c i.zero{background:var(--line)}
.cols .c span{font-size:10.5px;color:var(--muted)}
.cols .c b{font-size:11px;font-weight:650}

/* Log */
.logitem{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.logitem:last-child{border-bottom:0}
.logitem .chips{gap:5px;margin-top:7px}
.logitem .chip{padding:2px 8px;font-size:12px;background:var(--chip);border-color:transparent}
.seg-toggle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-toggle .chip{text-align:center;border-radius:12px;padding:10px 0;font-variant-numeric:tabular-nums}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent)}
nav.tabs a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Sheet / toast */
.scrim{position:fixed;inset:0;background:rgba(10,14,10,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:up .2s;max-width:90vw}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty .ico{width:52px;height:52px;border-radius:16px;background:var(--accent-weak);display:grid;place-items:center;margin:0 auto 12px}
.empty .ico svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.namegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.namegrid button{padding:16px;border-radius:14px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px}
.namegrid button.on{border-color:var(--accent);background:var(--accent-weak)}
.loading{display:grid;place-items:center;height:50vh;color:var(--muted)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tablelike .tr{display:grid;grid-template-columns:70px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.tablelike .th{font-size:12px;color:var(--muted);font-weight:600}
.tablelike input{padding:8px 10px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 21 7 16 10 12 8 8 11 3 17 3 17 9 15 13 17 17 17 21"/></svg></div><span id="appTitle">Saugerteam</span></div>
  <button class="me" id="meBtn" data-action="pick-me"></button>
</div></header>
<div id="banner"></div>
<main class="wrap" id="view"><div class="loading"><div class="spinner"></div></div></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  Konfiguration & Hilfsfunktionen
// ═══════════════════════════════════════════════════════════════
const CFG = Object.assign({ supabaseUrl:"", supabaseKey:"", title:"Saugerteam",
  weekdayWindow:"9–15 Uhr", weekendWindow:"8–10 Uhr", summerMonths:[4,5,6,7,8,9] }, window.APP_CONFIG || {});
const DEMO = !CFG.supabaseUrl || !CFG.supabaseKey;
document.getElementById('appTitle').textContent = CFG.title;
document.title = CFG.title;

const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DOW_SHORT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
const dateOf = s => { const {y,m,d} = parseYmd(s); return new Date(y,m-1,d); };
const todayYmd = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); };
const monthKey = (y,m) => `${y}-${pad(m)}`;
const daysInMonth = (y,m) => new Date(y,m,0).getDate();
const dow = s => dateOf(s).getDay();
const isWeekend = s => { const w = dow(s); return w===0 || w===6; };
const addMonths = (key, n) => { let [y,m] = key.split('-').map(Number); m += n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return monthKey(y,m); };
const monthLabel = key => { const [y,m] = key.split('-').map(Number); return `${MONTH_NAMES[m-1]} ${y}`; };
const fmtDay = s => { const {m,d} = parseYmd(s); return `${DOW_SHORT[dow(s)]}, ${d}. ${MONTH_NAMES[m-1].slice(0,3)}${m===5?'':'.'}`.replace('Mai.','Mai'); };
const fmtDate = s => { const {y,m,d} = parseYmd(s); return `${pad(d)}.${pad(m)}.${y}`; };
const daysBetween = (a,b) => Math.round((dateOf(b) - dateOf(a)) / 86400000);
const windowFor = s => isWeekend(s) ? CFG.weekendWindow : CFG.weekdayWindow;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n||'?').slice(0,2);
const isSummer = s => CFG.summerMonths.includes(parseYmd(s).m);

// ═══════════════════════════════════════════════════════════════
//  Datums-Erkennung aus E-Mail-Text (viele Formate)
// ═══════════════════════════════════════════════════════════════
const MONTH_WORDS = {januar:1,jänner:1,jaenner:1,january:1,jan:1,jän:1,februar:2,february:2,feb:2,märz:3,maerz:3,march:3,mär:3,mrz:3,mar:3,april:4,apr:4,mai:5,may:5,juni:6,june:6,jun:6,juli:7,july:7,jul:7,august:8,aug:8,september:9,sept:9,sep:9,oktober:10,october:10,okt:10,oct:10,november:11,nov:11,dezember:12,december:12,dez:12,dec:12};
const MW_RE = Object.keys(MONTH_WORDS).sort((a,b)=>b.length-a.length).join('|');
const L = '(?<![a-zäöüß])', R = '(?![a-zäöüß])';

function detectMonth(text){
  const t = text.toLowerCase(); const votes = {};
  for (const m of t.matchAll(new RegExp(`${L}(${MW_RE})${R}`,'g'))) { const n = MONTH_WORDS[m[1]]; votes[n] = (votes[n]||0) + 1; }
  for (const m of t.matchAll(/(?<![\d.])(\d{1,2})\s*\.\s*(\d{1,2})(?![\s.]*\d)/g)) { const d=+m[1], n=+m[2]; if (d>=1&&d<=31&&n>=1&&n<=12) votes[n]=(votes[n]||0)+1; }
  for (const m of t.matchAll(/(\d{4})-(\d{1,2})-(\d{1,2})/g)) { const n=+m[2]; votes[n]=(votes[n]||0)+1; }
  let best = null, bv = 0; for (const [k,v] of Object.entries(votes)) if (v>bv){bv=v;best=+k}
  return best;
}

function parseDates(text, year, month){
  const dim = daysInMonth(year, month);
  const out = new Set(); let ignored = 0;
  const add = (y,m,d) => { if (m===month && (y==null || y===year) && d>=1 && d<=dim) out.add(ymd(year,month,d)); else ignored++; };
  const addRange = (a,b) => { if (a<b && b-a<=31) for (let d=a; d<=b; d++) add(null,month,d); };
  let t = ' ' + String(text).toLowerCase().replace(/ /g,' ').replace(/[–—−‒]/g,'-') + ' ';
  // Störendes entfernen: Uhrzeiten, Kalenderwochen, Ordinal-Endungen
  t = t.replace(/\d{1,2}\s*[:.]\s*\d{2}\s*(uhr|h)(?![a-z])/g,' ')
       .replace(/\d{1,2}:\d{2}/g,' ')
       .replace(/\d{1,2}\s*(-|bis)\s*\d{1,2}\s*(uhr|h)(?![a-z])/g,' ')
       .replace(/\d{1,2}\s*(uhr|h)(?![a-z])/g,' ')
       .replace(/(kw|woche)\s*\d{1,2}/g,' ')
       .replace(/(\d{1,2})(st|nd|rd|th)(?![a-z])/g,'$1')
       .replace(new RegExp(`${L}(bis|to|until)${R}`,'g'),'-');
  // Monatsnamen → numerisch: "1. Dezember 2026" / "1 dez" / "Dec 1, 2026"
  t = t.replace(new RegExp(`(\\d{1,2})\\s*\\.?\\s*${L}(${MW_RE})${R}\\.?(\\s*(\\d{4}))?`,'g'), (_,d,mw,__,y) => ` ${d}.${MONTH_WORDS[mw]}.${y||''} `);
  t = t.replace(new RegExp(`${L}(${MW_RE})${R}\\.?\\s+(\\d{1,2})(?!\\d)(,?\\s*(\\d{4}))?`,'g'), (_,mw,d,__,y) => ` ${d}.${MONTH_WORDS[mw]}.${y||''} `);
  t = t.replace(new RegExp(`${L}(${MW_RE})${R}`,'g'),' ');            // übrige Monatswörter
  let sawDM = false;
  const cut = (re, fn) => { t = t.replace(re, (...a) => { fn(...a); return ' '; }); };
  // ISO 2026-12-01
  cut(/(\d{4})-(\d{1,2})-(\d{1,2})/g, (_,y,m,d) => add(+y,+m,+d));
  // Bereiche mit Monat: "1.12.-4.12."  /  "1.-4.12."
  cut(/(?<![\d.])(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?\s*-\s*(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?/g, (_,a,m1,y1,b,m2) => { sawDM = true; if (+m1===month && +m2===month) addRange(+a,+b); else ignored++; });
  cut(/(?<![\d.])(\d{1,2})\.?\s*-\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})?(?!\d)/g, (_,a,b,m) => { sawDM = true; if (+m===month) addRange(+a,+b); else ignored++; });
  // Volles Datum d.m.yyyy / d.m.yy (Jahr muss passen, sonst Liste wie 10.11.12.)
  cut(/(?<![\d.])(\d{1,2})\s*[./]\s*(\d{1,2})\s*[./]\s*(\d{4}|\d{2})(?!\d)/g, (_,d,m,y) => {
    let yy = +y; if (y.length===2) yy += 2000;
    if (yy===year || yy===year+1 || yy===year-1) add(yy,+m,+d); else { add(null,month,+d); add(null,month,+m); add(null,month,+y); }
  });
  // d.m. – nur als Datum deuten, wenn irgendwo der Zielmonat so geschrieben ist,
  // sonst ist "1.2.3.4." eine Liste von Tagen.
  const dm = /(?<![\d.])(\d{1,2})\s*\.\s*(\d{1,2})(?![\s.]*\d)\.?/g;
  const usesDM = sawDM || [...t.matchAll(dm)].some(m => +m[2]===month);
  if (usesDM) cut(dm, (_,d,m) => add(null,+m,+d));
  // Bereiche "1.-4." / "1 - 4" / "1.bis 4."
  cut(/(?<!\d)(\d{1,2})\s*\.?\s*-\s*(\d{1,2})(?!\d)\.?/g, (_,a,b) => addRange(+a,+b));
  // Jahreszahlen entfernen, dann alle übrigen 1–2-stelligen Zahlen als Tage
  t = t.replace(/(?<!\d)(19|20)\d{2}(?!\d)/g,' ');
  for (const m of t.matchAll(/(?<!\d)(\d{1,2})(?!\d)/g)) { const d=+m[1]; if (d>=1 && d<=dim) out.add(ymd(year,month,d)); else ignored++; }
  return { days:[...out].sort(), ignored };
}

class LocalStore {

  }
  seed(){

    const db = structuredClone(EMPTY); db.pin = '0000';
    db.members = s.members.map((name,i)=>({name, sort:i+1, active:true}));
    db.sectors = s.sectors.map(x=>({...x}));
    db.sessions = s.sessions.map((x,i)=>({id:i+1, note:'', ...x}));
    // Beispiel-Monat für die Demo: nächster Monat, Tage aus einer typischen Mail

    const days = parseDates('1./2./3./4.\n7./9./10./11.\n14./16./17./18.\n21./22./23.', y, m).days;
    for (let d=1; d<=daysInMonth(y,m); d++){ const s2=ymd(y,m,d); if (isWeekend(s2) && !days.includes(s2)) days.push(s2); }
    db.months.push({month:nk, days:days.sort(), target:2, plan:null});

    for (const [name,ds] of Object.entries(pick)) for (const d of ds){ const s2=ymd(y,m,d); if (db.months[0].days.includes(s2)) db.availability.push({month:nk, member:name, day:s2}); }

  }
  save(){ localStorage.setItem(this.key, JSON.stringify(this.db)); this.emit(); }
  emit(){ this.listeners.forEach(f=>f()); }
  subscribe(f){ this.listeners.push(f); }
  async load(){ const {pin, nextId, ...rest} = this.db; return structuredClone(rest); }
  async setAvailability(month, member, day, on){
    this.db.availability = this.db.availability.filter(a => !(a.member===member && a.day===day));
    if (on) this.db.availability.push({month, member, day}); this.save();
  }
  async setNote(month, member, note){
    this.db.notes = this.db.notes.filter(n => !(n.month===month && n.member===member));
    if (note) this.db.notes.push({month, member, note}); this.save();
  }

    if (s.id){ const i = this.db.sessions.findIndex(x=>x.id===s.id); if (i>=0) this.db.sessions[i] = {...s}; }
    else this.db.sessions.push({...s, id:this.db.nextId++});
    this.save();
  }
  async deleteSession(id){ this.db.sessions = this.db.sessions.filter(x=>x.id!==id); this.save(); }
  chk(pin){ if (pin !== this.db.pin) throw new Error('Falsche PIN'); }
  async adminCheck(pin){ return pin === this.db.pin; }
  async adminSaveMonth(pin, month, days, target){
    this.chk(pin); const i = this.db.months.findIndex(m=>m.month===month);
    if (i>=0) Object.assign(this.db.months[i], {days, target}); else this.db.months.push({month, days, target, plan:null});
    this.db.availability = this.db.availability.filter(a => a.month!==month || days.includes(a.day)); this.save();
  }
  async adminDeleteMonth(pin, month){ this.chk(pin); this.db.months = this.db.months.filter(m=>m.month!==month); this.db.availability = this.db.availability.filter(a=>a.month!==month); this.save(); }
  async adminSavePlan(pin, month, plan){ this.chk(pin); const m = this.db.months.find(m=>m.month===month); if (m) m.plan = plan; this.save(); }
  async adminSaveMembers(pin, list){ this.chk(pin); this.db.members = list.map((x,i)=>({name:x.name, active:x.active, sort:i+1})); this.save(); }
  async adminSaveSectors(pin, list){ this.chk(pin); this.db.sectors = list.map((x,i)=>({...x, sort:i+1})); this.save(); }
  async adminSetPin(pin, newPin){ this.chk(pin); this.db.pin = newPin; this.save(); }
  async resetDemo(){ this.db = this.seed(); this.save(); }
}

class SupaStore {
  async init(){
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    this.sb = createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth:{ persistSession:false } });
    this.listeners = [];
    this.sb.channel('alles').on('postgres_changes', {event:'*', schema:'public'}, () => this.listeners.forEach(f=>f())).subscribe();
  }
  subscribe(f){ this.listeners.push(f); }
  ok(r){ if (r.error) throw new Error(r.error.message); return r.data; }
  async load(){
    const t = n => this.sb.from(n).select('*');
    const [members, sectors, months, availability, notes, sessions] = await Promise.all([
      t('members').order('sort'), t('sectors').order('sort'), t('months'), t('availability'), t('notes'), t('sessions').order('day')
    ].map(p => p.then(r => this.ok(r))));
    return { members, sectors, months:months.map(m=>({...m, days:(m.days||[]).slice().sort()})), availability, notes,
      sessions:sessions.map(s=>({...s, sectors:s.sectors||[]})) };
  }
  async setAvailability(month, member, day, on){
    if (on) this.ok(await this.sb.from('availability').upsert({month, member, day}));
    else this.ok(await this.sb.from('availability').delete().match({member, day}));
  }
  async setNote(month, member, note){ this.ok(await this.sb.from('notes').upsert({month, member, note})); }
  async saveSession(s){
    const row = {day:s.day, person1:s.person1, person2:s.person2||null, sectors:s.sectors, note:s.note||''};
    if (s.id) this.ok(await this.sb.from('sessions').update(row).eq('id', s.id));
    else this.ok(await this.sb.from('sessions').insert(row));
  }
  async deleteSession(id){ this.ok(await this.sb.from('sessions').delete().eq('id', id)); }
  rpc(fn, args){ return this.sb.rpc(fn, args).then(r => this.ok(r)); }
  adminCheck(pin){ return this.rpc('admin_check', {p_pin:pin}); }
  adminSaveMonth(pin, month, days, target){ return this.rpc('admin_save_month', {p_pin:pin, p_month:month, p_days:days, p_target:target}); }
  adminDeleteMonth(pin, month){ return this.rpc('admin_delete_month', {p_pin:pin, p_month:month}); }
  adminSavePlan(pin, month, plan){ return this.rpc('admin_save_plan', {p_pin:pin, p_month:month, p_plan:plan}); }
  adminSaveMembers(pin, list){ return this.rpc('admin_save_members', {p_pin:pin, p_members:list}); }
  adminSaveSectors(pin, list){ return this.rpc('admin_save_sectors', {p_pin:pin, p_sectors:list}); }
  adminSetPin(pin, newPin){ return this.rpc('admin_set_pin', {p_pin:pin, p_new:newPin}); }
}

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function availMap(monthK){
  const mo = getMonth(monthK); const act = new Set(activeMembers()); const map = {};
  if (!mo) return map;
  for (const d of mo.days) map[d] = [];
  for (const a of S.data.availability) if (a.month===monthK && map[a.day] && act.has(a.member)) map[a.day].push(a.member);
  for (const d in map) map[d].sort((a,b)=>activeMembers().indexOf(a)-activeMembers().indexOf(b));
  return map;
}
function computePlan(monthK){
  const mo = getMonth(monthK); if (!mo) return null;
  const av = availMap(monthK); const target = Math.max(1, mo.target || 2);
  const days = Object.keys(av).filter(d => av[d].length >= 2).sort();
  const total = {}; for (const d in av) for (const p of av[d]) total[p] = (total[p]||0) + 1;
  const people = Object.keys(total);
  let best = null;
  for (let t=0; t<400; t++){
    const r = rng(t*7919+13); const jit = t ? 1 : 0;
    const order = days.map(d => [d, av[d].length + jit*r()*3]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    const load = {}; const sess = [];
    for (const d of order){
      const cand = av[d].filter(p => (load[p]||0) < target);
      if (cand.length < 2) continue;
      if (t%3===2 && sess.some(s => Math.abs(daysBetween(s.day,d)) < 2)) continue;   // Variante mit Abstand
      const key = p => (load[p]||0)*10 + total[p]*0.6 + jit*r()*4;
      const ks = cand.map(p=>[p,key(p)]).sort((a,b)=>a[1]-b[1]);
      const pair = [ks[0][0], ks[1][0]];
      pair.forEach(p => load[p] = (load[p]||0) + 1);
      sess.push({ day:d, people:pair });
    }
    sess.sort((a,b)=>a.day<b.day?-1:1);
    const loads = people.map(p=>load[p]||0); const mean = loads.reduce((a,b)=>a+b,0)/(loads.length||1);
    const varc = loads.reduce((a,b)=>a+(b-mean)**2,0);
    const zero = loads.filter(x=>x===0).length;
    let spread = 0; for (let i=1;i<sess.length;i++) spread += Math.min(daysBetween(sess[i-1].day, sess[i].day), 7);
    const score = sess.length*1000 - zero*250 - varc*40 + spread*3;
    if (!best || score > best.score) best = { score, sessions:sess, load };
  }
  return { sessions: best ? best.sessions : [], target };
}
function currentPlan(monthK){
  const mo = getMonth(monthK); if (!mo) return null;
  if (mo.plan && mo.plan.sessions) return { sessions: mo.plan.sessions, locked:true, target:mo.target };
  return { ...computePlan(monthK), locked:false };
}

function sectorStatus(sec, ref = todayYmd()){
  let last = null, by = null;
  for (const s of S.data.sessions) if (s.sectors.includes(sec.id) && s.day <= ref && (!last || s.day > last)) { last = s.day; by = s; }
  const interval = isSummer(ref) ? sec.interval_summer : sec.interval_winter;
  if (!last) return { status:'unknown', last:null, days:null, interval, ratio:99, by:null };
  const days = daysBetween(last, ref);

}

    <button class="iconbtn" data-action="month" data-d="-1" aria-label="Vorheriger Monat">${ICON.left}</button>
    <div class="title">${monthLabel(k)}<small>${mo ? `${mo.days.length} freie Tage · ${CFG.weekdayWindow} unter der Woche, ${CFG.weekendWindow} am Wochenende` : 'Noch keine Termine freigegeben'}</small></div>
    <button class="iconbtn" data-action="month" data-d="1" aria-label="Nächster Monat">${ICON.right}</button></div>`;
  if (!mo){
    h += `<div class="card empty"><div class="ico">${ICON.termine}</div>
      <div style="font-weight:600;color:var(--text)">Für ${MONTH_NAMES[+k.split('-')[1]-1]} gibt es noch keine Termin-Optionen.</div>
      <div class="small" style="margin-top:4px">Neue Termine werden unter <b>Einstellungen</b> freigegeben.</div>
      ${known.length ? `<div class="chips" style="justify-content:center;margin-top:14px">${known.slice(-4).map(x=>`<button class="chip" data-action="goto-month" data-k="${x}">${monthLabel(x)}</button>`).join('')}</div>`:''}</div>`;
    return h;
  }
  const av = availMap(k); const plan = currentPlan(k);
  const planned = new Set(plan.sessions.map(s=>s.day));
  const mine = new Set(S.data.availability.filter(a=>a.month===k && a.member===S.me).map(a=>a.day));
  const today = todayYmd();
  h += `<div class="card">
    <div class="small muted" style="margin-bottom:12px">${S.me ? `Tippe alle Tage an, an denen <b style="color:var(--text)">du</b> kannst.` : 'Wähle oben rechts zuerst deinen Namen.'}</div>
    ${calendar(k, (s,d) => {
      const open = av[s] !== undefined; const n = open ? av[s].length : 0;
      if (!open) return `<div class="day off ${s===today?'today':''}"><span class="num">${d}</span></div>`;
      const cls = ['day','open', isWeekend(s)?'we':'', mine.has(s)?'sel':'', planned.has(s)?'planned':'', s===today?'today':''].join(' ');
      return `<button class="${cls}" data-action="toggle-day" data-day="${s}" aria-pressed="${mine.has(s)}"><span class="num">${d}</span>
        <span class="dots">${'<i></i>'.repeat(Math.min(n,4))}</span></button>`;
    })}
    <div class="legend"><span><i style="background:var(--accent)"></i>Du kannst</span><span><i style="border:2px solid var(--accent)"></i>Im Plan</span><span><i style="background:var(--chip)"></i>Wochenende</span><span>• = Zusagen</span></div>
  </div>`;
  if (S.me){
    const note = (S.data.notes.find(n=>n.month===k && n.member===S.me)||{}).note || '';
    h += `<div class="card"><label class="field" style="margin:0"><span>Anmerkung für ${MONTH_NAMES[+k.split('-')[1]-1]} (optional)</span>
      <input type="text" id="noteInput" value="${esc(note)}" placeholder="z. B. lieber früh morgens, ab dem 10. erst"></label></div>`;
  }
  // Plan
  const loads = {}; plan.sessions.forEach(s=>s.people.forEach(p=>loads[p]=(loads[p]||0)+1));
  h += `<h2>Plan ${plan.locked ? '<span class="pill ok plain" style="margin-left:6px;text-transform:none;letter-spacing:0">festgelegt</span>' : '<span class="pill unknown plain" style="margin-left:6px;text-transform:none;letter-spacing:0">automatisch</span>'}</h2>`;
  h += '<div class="card">';
  if (!plan.sessions.length) h += `<div class="muted small">Sobald an einem Tag zwei Leute können, erscheint hier automatisch ein Team.</div>`;
  for (const s of plan.sessions){
    const {d,m} = parseYmd(s.day); const gone = s.people.filter(p => !(av[s.day]||[]).includes(p));
    h += `<div class="slot"><div class="datebox"><b>${d}</b><span>${DOW_SHORT[dow(s.day)]}</span></div>
      <div class="grow"><div class="who">${s.people.map(p=>p===S.me?`<span class="me-hl">${esc(p)}</span>`:esc(p)).join(' &amp; ')}</div>
      <div class="small muted">${fmtDay(s.day)} · ${windowFor(s.day)}</div>
      ${plan.locked && gone.length ? `<div class="small" style="color:var(--urgent)">${gone.map(esc).join(', ')} hat inzwischen abgesagt</div>`:''}</div></div>`;
  }
  h += '</div>';
  // Hinweise
  const hints = [];
  const covered = new Set(plan.sessions.map(s=>s.day));
  const lonely = Object.keys(av).sort().filter(d => av[d].length===1 && !covered.has(d));
  if (lonely.length) hints.push(`Fast geschafft – hier fehlt nur eine zweite Person: ${lonely.slice(0,5).map(d=>`<b>${fmtDay(d)}</b> (${esc(av[d][0])})`).join(', ')}`);
  const said = new Set(S.data.availability.filter(a=>a.month===k).map(a=>a.member));
  const silent = activeMembers().filter(n=>!said.has(n));
  if (silent.length) hints.push(`Noch keine Angaben von: <b>${silent.map(esc).join(', ')}</b>`);
  const notesHere = S.data.notes.filter(n=>n.month===k && n.note);
  if (notesHere.length) hints.push(notesHere.map(n=>`<b>${esc(n.member)}:</b> ${esc(n.note)}`).join('<br>'));
  h += hints.map(x=>`<div class="hint"><span>${x}</span></div>`).join('');
  if (Object.keys(loads).length) h += `<div class="small muted" style="margin-top:10px">${plan.sessions.length} Termine · ${Object.entries(loads).map(([p,n])=>`${esc(p)} ${n}×`).join(' · ')}</div>`;
  // Matrix
  const days = Object.keys(av).sort();
  h += `<h2>Wer kann wann</h2><div class="card"><details class="fold"><summary>Übersicht wie im Sheet</summary><div class="matrix" style="margin-top:12px"><table>
    <tr><th></th>${days.map(d=>`<th>${DOW_SHORT[dow(d)]}<br>${parseYmd(d).d}.</th>`).join('')}</tr>
    ${activeMembers().map(p=>`<tr><td>${esc(p)}</td>${days.map(d=>`<td><span class="${av[d].includes(p)?'y':'n'}"></span></td>`).join('')}</tr>`).join('')}
    <tr class="sum"><td>Summe</td>${days.map(d=>`<td>${av[d].length||''}</td>`).join('')}</tr></table></div></details></div>`;
  return h;
}

function viewWand(){
  const ref = todayYmd(); const season = isSummer(ref) ? 'Sommer' : 'Winter';
  const rows = S.data.sectors.map(sec => ({sec, ...sectorStatus(sec, ref)}))
    .sort((a,b)=> b.ratio - a.ratio);
  const cnt = st => rows.filter(r=>r.status===st).length;
  let h = `<h1>Wand-Status</h1><p class="sub">${season}-Intervalle aktiv · Tippe einen Bereich für Details.</p>`;
  h += `<div class="card">${wallSVG({mode:'status'})}
    <div class="legend" style="justify-content:center"><span><i style="background:var(--ok)"></i>OK (${cnt('ok')})</span><span><i style="background:var(--soon)"></i>Bald (${cnt('soon')})</span><span><i style="background:var(--urgent)"></i>Dringend (${cnt('urgent')})</span>${cnt('unknown')?`<span><i style="background:var(--unknown)"></i>Unbekannt (${cnt('unknown')})</span>`:''}</div></div>`;
  h += `<h2>Als Nächstes dran</h2><div class="card">`;
  for (const r of rows){
    const pct = r.days==null ? 100 : Math.min(100, Math.round(r.days / r.interval * 100));
    h += `<div class="secrow" data-action="sector-info" data-id="${esc(r.sec.id)}"><div class="secname">${esc(r.sec.id)}</div>
      <div class="grow"><div class="row between"><span class="small muted">${r.last ? `vor ${r.days} Tagen · ${fmtDate(r.last)}` : 'noch nie erfasst'}</span><span class="pill ${r.status}">${STATUS_TXT[r.status]}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${STATUS_COL[r.status]}"></i></div></div></div>`;
  }
  h += `</div><div class="small muted" style="margin-top:10px">„Bald“ ab 80 % des Intervalls, „Dringend“ ab 100 %. Intervalle änderst du unter Einstellungen.</div>`;
  return h;
}

function newLogForm(day = todayYmd()){
  const f = { id:null, day, person1:S.me||'', person2:'', sectors:new Set(), note:'' };
  prefillFromPlan(f); return f;
}
function prefillFromPlan(f){
  const mk = f.day.slice(0,7); const mo = getMonth(mk); if (!mo) return;
  const s = currentPlan(mk).sessions.find(x=>x.day===f.day);
  if (s){ const [a,b] = s.people; if (S.me===b){ f.person1=b; f.person2=a; } else { f.person1=a; f.person2=b; } }
}

    <div class="chips">${s.sectors.length ? s.sectors.map(x=>`<span class="chip static">${esc(x)}</span>`).join('') : '<span class="small muted">keine Abschnitte erfasst</span>'}</div>
    ${s.note?`<div class="small muted" style="margin-top:4px">${esc(s.note)}</div>`:''}</div>`).join('') : '<div class="muted small">Noch keine Einsätze.</div>'}
    ${list.length > (S.logLimit||15) ? `<button class="btn ghost block" data-action="more-log">Ältere anzeigen</button>`:''}</div>`;

function viewStatistik(){
  const ss = S.data.sessions; const today = todayYmd(); const y = parseYmd(today).y;
  const per = {}; const lastBy = {};
  for (const s of ss) for (const p of [s.person1, s.person2]) if (p){ per[p]=(per[p]||0)+1; if (!lastBy[p] || s.day>lastBy[p]) lastBy[p]=s.day; }
  const act = new Set(activeMembers());
  const names = [...new Set([...activeMembers(), ...Object.keys(per)])].sort((a,b)=>(per[b]||0)-(per[a]||0));
  const max = Math.max(1, ...Object.values(per));
  const last = ss.reduce((a,s)=> !a || s.day>a ? s.day : a, null);
  let h = `<h1>Statistik</h1><p class="sub">Alle erfassten Einsätze.</p>
  <div class="kpis"><div class="kpi"><b>${ss.length}</b><span>Einsätze gesamt</span></div>
  <div class="kpi"><b>${ss.filter(s=>s.day.startsWith(String(y))).length}</b><span>in ${y}</span></div>
  <div class="kpi"><b>${last ? daysBetween(last, today) : '–'}</b><span>Tage seit letztem</span></div></div>`;
  h += `<h2>Einsätze pro Person</h2><div class="card">${names.map(n=>`<div class="hbar ${act.has(n)?'':'inactive'}"><span>${esc(n)}</span>
    <div class="track"><i style="width:${(per[n]||0)/max*100}%"></i></div><span class="val">${per[n]||0}</span></div>`).join('')}
    <div class="small muted" style="margin-top:8px">${names.filter(n=>lastBy[n]).map(n=>`${esc(n)}: zuletzt ${fmtDate(lastBy[n])}`).join(' · ')}</div></div>`;
  // letzte 12 Monate
  const months = []; let k = monthKey(y, parseYmd(today).m); for (let i=0;i<12;i++){ months.unshift(k); k = addMonths(k,-1); }
  const mc = months.map(m=>ss.filter(s=>s.day.startsWith(m)).length); const mmax = Math.max(1,...mc);
  h += `<h2>Einsätze pro Monat</h2><div class="card"><div class="cols">${months.map((m,i)=>`<div class="c"><b>${mc[i]||''}</b><i class="${mc[i]?'':'zero'}" style="height:${mc[i]/mmax*80}%"></i><span>${MONTH_NAMES[+m.split('-')[1]-1].slice(0,3)}</span></div>`).join('')}</div></div>`;
  const sc = S.data.sectors.map(sec=>[sec.id, ss.filter(s=>s.sectors.includes(sec.id)).length]); const smax = Math.max(1,...sc.map(x=>x[1]));
  h += `<h2>Wie oft wurde welcher Bereich gesaugt</h2><div class="card">${sc.map(([id,n])=>`<div class="hbar"><span>${esc(id)}</span><div class="track"><i style="width:${n/smax*100}%"></i></div><span class="val">${n}</span></div>`).join('')}</div>`;
  return h;
}

    h += `<div class="card"><div class="row" style="margin-bottom:12px"><div class="empty" style="padding:0;margin:0"><div class="ico" style="margin:0;width:40px;height:40px">${ICON.lock}</div></div>

  const [ay, am] = A.month.split('-').map(Number);
  h += `<div class="card"><b style="font-size:16px">Termin-Optionen freigeben</b>
    <div class="small muted" style="margin:2px 0 14px">E-Mail-Text einfügen – Daten werden in fast jedem Format erkannt („1./2./3.“, „1.12.“, „1.–4. Dez“, „Montag, 7. Dezember“, „2026-12-01“ …).</div>
    <label class="field"><span>Monat</span><input type="month" id="admMonth" value="${A.month}"></label>
    <label class="field"><span>Text aus der E-Mail</span><textarea id="admText" placeholder="folgende Dezember-Termine sind frei:&#10;* 1./2./3./4.&#10;* 7./9./10./11.">${esc(A.text)}</textarea></label>
    <label class="check" style="margin-bottom:14px"><input type="checkbox" id="admWeekends" ${A.weekends?'checked':''}> Wochenenden hinzufügen (${CFG.weekendWindow})</label>
    <button class="btn block" data-action="parse">Daten erkennen</button>
    ${A.parsedInfo ? `<div class="small muted" style="margin-top:10px">${A.parsedInfo}</div>`:''}
    <hr class="sep"><div class="row between" style="margin-bottom:10px"><span class="small muted">Vorschau ${monthLabel(A.month)} – zum Korrigieren antippen</span><span class="pill ok plain">${A.days.size} Tage</span></div>
    ${calendar(A.month, (s,d)=>`<button class="day open ${isWeekend(s)?'we':''} ${A.days.has(s)?'sel':''}" data-action="adm-toggle" data-day="${s}"><span class="num">${d}</span><span class="meta">${DOW_SHORT[dow(s)]}</span></button>`)}
    <label class="field" style="margin-top:14px"><span>Ziel: Einsätze pro Person im Monat</span><input type="number" id="admTarget" min="1" max="10" value="${A.target}"></label>
    <div class="row"><button class="btn primary grow" data-action="adm-save" ${A.days.size?'':'disabled'}>${existing?'Aktualisieren':'Freigeben'}</button>
    ${existing?`<button class="btn danger" data-action="adm-delete">Monat löschen</button>`:''}</div>
    ${existing ? `<hr class="sep"><div class="row between"><div><b>Plan ${existing.plan?'ist festgelegt':'festlegen'}</b><div class="small muted">${existing.plan?'Ändert sich nicht mehr, wenn jemand nachträglich Tage ändert.':'Friert den aktuellen automatischen Vorschlag ein.'}</div></div>
      <button class="btn" data-action="${existing.plan?'adm-unlock-plan':'adm-lock-plan'}">${existing.plan?'Lösen':'Festlegen'}</button></div>`:''}
  </div>`;
  // ── Team
  h += `<div class="card"><b style="font-size:16px">Team</b><div class="small muted" style="margin:2px 0 12px">Inaktive bleiben in der Statistik, bekommen aber keine Termine.</div>
    ${S.data.members.map((m,i)=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-weight:550;${m.active===false?'opacity:.5':''}">${esc(m.name)}</span>
      <label class="check small"><input type="checkbox" data-action="member-active" data-i="${i}" ${m.active!==false?'checked':''}> aktiv</label></div>`).join('')}
    <div class="row" style="margin-top:12px"><input type="text" id="newMember" placeholder="Neuer Name"><button class="btn" data-action="add-member">Hinzufügen</button></div></div>`;
  // ── Bereiche
  h += `<div class="card"><b style="font-size:16px">Wandbereiche &amp; Putz-Intervalle</b><div class="small muted" style="margin:2px 0 12px">Tage bis „Dringend“. Sommer = ${CFG.summerMonths.map(m=>MONTH_NAMES[m-1].slice(0,3)).join(', ')}.</div>

    ${S.data.sectors.map((s,i)=>`<div class="tr"><input type="text" data-sec="${i}" data-f="id" value="${esc(s.id)}"><input type="number" data-sec="${i}" data-f="interval_summer" value="${s.interval_summer}"><input type="number" data-sec="${i}" data-f="interval_winter" value="${s.interval_winter}"><button class="iconbtn" data-action="del-sector" data-i="${i}" aria-label="Entfernen">×</button></div>`).join('')}</div>
    <div class="row"><button class="btn" data-action="add-sector">+ Bereich</button><button class="btn primary grow" data-action="save-sectors">Speichern</button></div></div>`;
  // ── Sonstiges
  h += `<div class="card"><b style="font-size:16px">Sonstiges</b>
    <div class="row" style="margin-top:12px"><input type="password" id="newPin" inputmode="numeric" placeholder="Neue PIN"><button class="btn" data-action="set-pin">PIN ändern</button></div>
    <div class="row" style="margin-top:10px"><button class="btn grow" data-action="export">Protokoll als CSV</button><button class="btn ghost" data-action="lock">Sperren</button></div>
    ${DEMO?`<button class="btn ghost danger block" style="margin-top:8px" data-action="reset-demo">Demo-Daten zurücksetzen</button>`:''}</div>`;
  return h;
}

const $ = s => document.querySelector(s);
function renderShell(){
  $('#tabs').innerHTML = TABS.map(([id,label])=>`<a href="#${id}" class="${S.tab===id?'on':''}">${ICON[id]}<span>${label}</span></a>`).join('');
  $('#meBtn').innerHTML = S.me ? `<span class="avatar">${esc(initials(S.me))}</span>${esc(S.me)}` : `<span class="avatar">?</span>Wer bist du?`;
  $('#banner').innerHTML = DEMO ? `<div class="banner"><div>Demo-Modus – noch nicht mit Supabase verbunden (siehe Anleitung).</div></div>` : '';
}
function render(){
  renderShell();
  if (S.error){ $('#view').innerHTML = `<div class="card empty" style="margin-top:24px"><div style="font-weight:600;color:var(--text)">Datenbank nicht erreichbar</div><div class="small" style="margin:6px 0 14px">${esc(S.error)}<br>Falls das Supabase-Projekt pausiert ist: im Supabase-Dashboard „Resume project“.</div><button class="btn" data-action="retry">Nochmal versuchen</button></div>`; return; }
  if (!S.loaded) return;
  const v = { termine:viewTermine, wand:viewWand, einsatz:viewEinsatz, statistik:viewStatistik, einstellungen:viewEinstellungen }[S.tab] || viewTermine;
  const y = window.scrollY; $('#view').innerHTML = v(); window.scrollTo(0, y);
}
function scheduleRender(){
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#view').contains(a)) { S.pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(()=>{ if (S.pendingRender){ S.pendingRender=false; scheduleRender(); } }, 50));

let toastT; function toast(msg){ document.querySelector('.toast')?.remove(); const d = document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 2600); }
function sheet(html){ closeSheet(); const d = document.createElement('div'); d.className='scrim'; d.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`; d.addEventListener('click', e=>{ if (e.target===d) closeSheet(); }); document.body.appendChild(d); }
function closeSheet(){ document.querySelector('.scrim')?.remove(); }

async function reload(){
  try { S.data = await withTimeout(S.store.load(), 15000, 'Keine Antwort von Supabase (Zeitüberschreitung). URL in config.js prüfen – sie muss genau so aussehen: https://xxxx.supabase.co'); S.error = null; S.loaded = true; }
  catch(e){ S.error = e.message || String(e); }
  if (!S.month){
    const cur = monthKey(new Date().getFullYear(), new Date().getMonth()+1);
    const ks = S.data.months.map(m=>m.month).filter(k=>k>=cur).sort();
    S.month = ks.length ? ks[ks.length-1] : cur;
  }
  if (S.me && !S.data.members.some(m=>m.name===S.me)) { S.me=''; ls('saugerteam-me',null); }
  scheduleRender();
  if (S.loaded && !S.me && !document.querySelector('.scrim')) pickMe();
}
let reloadT; const softReload = () => { clearTimeout(reloadT); reloadT = setTimeout(reload, 250); };

function pickMe(){
  sheet(`<h3>Wer bist du?</h3><div class="small muted">Wird nur auf diesem Gerät gespeichert.</div>
    <div class="namegrid">${activeMembers().map(n=>`<button class="${n===S.me?'on':''}" data-action="set-me" data-name="${esc(n)}"><span class="avatar">${esc(initials(n))}</span>${esc(n)}</button>`).join('')}</div>`);
}
function sectorInfo(id){
  const sec = S.data.sectors.find(s=>s.id===id); if (!sec) return; const st = sectorStatus(sec);
  const hist = S.data.sessions.filter(s=>s.sectors.includes(id)).sort((a,b)=>a.day<b.day?1:-1).slice(0,6);
  sheet(`<div class="row between"><h3>Bereich ${esc(id)}</h3><span class="pill ${st.status}">${STATUS_TXT[st.status]}</span></div>
    <div class="small muted">${st.last ? `Zuletzt am ${fmtDate(st.last)} (vor ${st.days} Tagen) von ${[st.by.person1,st.by.person2].filter(Boolean).map(esc).join(' & ')}` : 'Noch nie erfasst'} · Intervall ${st.interval} Tage (${isSummer(todayYmd())?'Sommer':'Winter'})</div>
    <h2 style="margin-top:20px">Verlauf</h2>${hist.length ? hist.map(s=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(s.day)}</span><span class="small muted">${[s.person1,s.person2].filter(Boolean).map(esc).join(' & ')}</span></div>`).join('') : '<div class="small muted">–</div>'}
    <button class="btn primary block" style="margin-top:16px" data-action="log-sector" data-id="${esc(id)}">Jetzt als gesaugt eintragen</button>`);
}

// ═══════════════════════════════════════════════════════════════
//  Aktionen
// ═══════════════════════════════════════════════════════════════
const withTimeout = (pr, ms, msg) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)), ms))]);
const guard = async (fn, okMsg) => { try { await fn(); if (okMsg) toast(okMsg); } catch(e){ toast(e.message || 'Fehler'); await reload(); } };

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (el.tagName === 'INPUT') return; // Checkboxen über change
  switch (a){
    case 'pick-me': pickMe(); break;
    case 'set-me': S.me = el.dataset.name; ls('saugerteam-me', S.me); S.log = null; closeSheet(); render(); break;
    case 'month': S.month = addMonths(S.month, +el.dataset.d); render(); break;
    case 'goto-month': S.month = el.dataset.k; render(); break;
    case 'toggle-day': {
      if (!S.me) return pickMe();
      const day = el.dataset.day; const on = !S.data.availability.some(x=>x.member===S.me && x.day===day);
      if (on) S.data.availability.push({month:S.month, member:S.me, day}); else S.data.availability = S.data.availability.filter(x=>!(x.member===S.me && x.day===day));
      render(); await guard(()=>S.store.setAvailability(S.month, S.me, day, on)); break;
    }
    case 'sector-info': sectorInfo(el.dataset.id); break;
    case 'log-sector': S.log = newLogForm(); S.log.sectors.add(el.dataset.id); closeSheet(); location.hash = 'einsatz'; break;
    case 'toggle-sector': { const s = S.log.sectors; const id = el.dataset.id; s.has(id) ? s.delete(id) : s.add(id); render(); break; }
    case 'pick-urgent': S.data.sectors.forEach(sec=>{ if (sectorStatus(sec).status!=='ok') S.log.sectors.add(sec.id); }); render(); break;
    case 'save-log': {
      const f = S.log; if (!f.person1) return toast('Bitte mindestens eine Person wählen');
      if (!f.sectors.size && !confirm('Keine Abschnitte gewählt – trotzdem speichern?')) return;
      const order = S.data.sectors.map(s=>s.id);
      await guard(()=>S.store.saveSession({ id:f.id, day:f.day, person1:f.person1, person2:f.person2, sectors:[...f.sectors].sort((x,y)=>order.indexOf(x)-order.indexOf(y)), note:f.note }), f.id?'Gespeichert':'Einsatz eingetragen – danke!');
      S.log = null; await reload(); break;
    }
    case 'edit-log': { const s = S.data.sessions.find(x=>String(x.id)===el.dataset.id); if (!s) return;
      S.log = { id:s.id, day:s.day, person1:s.person1||'', person2:s.person2||'', sectors:new Set(s.sectors), note:s.note||'' }; render(); window.scrollTo({top:0,behavior:'smooth'}); break; }
    case 'cancel-log': S.log = null; render(); break;
    case 'delete-log': if (confirm('Diesen Einsatz löschen?')) { await guard(()=>S.store.deleteSession(S.log.id), 'Gelöscht'); S.log = null; await reload(); } break;
    case 'more-log': S.logLimit = (S.logLimit||15) + 30; render(); break;
    case 'share': { const url = location.href.split('#')[0]; try { if (navigator.share) await navigator.share({title:CFG.title, url}); else { await navigator.clipboard.writeText(url); toast('Link kopiert'); } } catch {} break; }
    case 'unlock': { const pin = $('#pinInput').value.trim(); let ok=false; try { ok = await S.store.adminCheck(pin); } catch(err){ return toast(err.message); }
      if (ok){ S.pin = pin; sessionStorage.setItem('saugerteam-pin', pin); render(); } else toast('Falsche PIN'); break; }
    case 'lock': S.pin=''; sessionStorage.removeItem('saugerteam-pin'); render(); break;
    case 'parse': doParse(); break;
    case 'adm-toggle': { const d = el.dataset.day; S.admin.days.has(d) ? S.admin.days.delete(d) : S.admin.days.add(d); render(); break; }
    case 'adm-save': { const A = S.admin; await guard(()=>S.store.adminSaveMonth(S.pin, A.month, [...A.days].sort(), +A.target||2), `${monthLabel(A.month)} freigegeben`); S.month = A.month; await reload(); break; }
    case 'adm-delete': if (confirm(`${monthLabel(S.admin.month)} inkl. aller Zusagen löschen?`)) { await guard(()=>S.store.adminDeleteMonth(S.pin, S.admin.month), 'Gelöscht'); S.admin.days = null; await reload(); } break;
    case 'adm-lock-plan': { const p = computePlan(S.admin.month); await guard(()=>S.store.adminSavePlan(S.pin, S.admin.month, {sessions:p.sessions, lockedAt:new Date().toISOString()}), 'Plan festgelegt'); await reload(); break; }
    case 'adm-unlock-plan': await guard(()=>S.store.adminSavePlan(S.pin, S.admin.month, null), 'Plan wieder automatisch'); await reload(); break;
    case 'add-member': { const n = $('#newMember').value.trim(); if (!n) return; if (S.data.members.some(m=>m.name.toLowerCase()===n.toLowerCase())) return toast('Name existiert schon');
      await guard(()=>S.store.adminSaveMembers(S.pin, [...S.data.members.map(m=>({name:m.name, active:m.active!==false})), {name:n, active:true}]), `${n} hinzugefügt`); await reload(); break; }
    case 'add-sector': S.data.sectors.push({id:'', interval_summer:40, interval_winter:15, sort:99}); render(); break;
    case 'del-sector': S.data.sectors.splice(+el.dataset.i,1); render(); break;
    case 'save-sectors': { const list = S.data.sectors.filter(s=>s.id.trim()).map(s=>({id:s.id.trim(), interval_summer:+s.interval_summer||30, interval_winter:+s.interval_winter||15}));
      await guard(()=>S.store.adminSaveSectors(S.pin, list), 'Bereiche gespeichert'); await reload(); break; }
    case 'set-pin': { const n = $('#newPin').value.trim(); if (n.length<4) return toast('Mindestens 4 Zeichen'); await guard(()=>S.store.adminSetPin(S.pin, n), 'PIN geändert'); S.pin=n; sessionStorage.setItem('saugerteam-pin', n); break; }
    case 'export': exportCSV(); break;
    case 'reset-demo': if (confirm('Demo-Daten zurücksetzen?')) { await S.store.resetDemo(); S.admin.days=null; await reload(); } break;
    case 'retry': S.error=null; await reload(); break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'noteInput') await guard(()=>S.store.setNote(S.month, S.me, t.value.trim()), 'Anmerkung gespeichert');
  if (t.id === 'meSelect') { S.me = t.value; ls('saugerteam-me', S.me || null); S.log=null; renderShell(); }
  if (t.id === 'logDay') { S.log.day = t.value; prefillFromPlan(S.log); render(); }
  if (t.id === 'logP1') { S.log.person1 = t.value; render(); }
  if (t.id === 'logP2') { S.log.person2 = t.value; }
  if (t.id === 'admMonth' && t.value) { S.admin.month = t.value; S.admin.monthTouched = true; S.admin.days = null; if (S.admin.text) doParse(true); else render(); }
  if (t.id === 'admWeekends') { S.admin.weekends = t.checked; applyWeekends(t.checked); render(); }
  if (t.id === 'admTarget') S.admin.target = +t.value || 2;
  if (t.dataset.action === 'member-active') { const list = S.data.members.map((m,i)=>({name:m.name, active: i===+t.dataset.i ? t.checked : m.active!==false}));
    await guard(()=>S.store.adminSaveMembers(S.pin, list)); await reload(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'logNote') S.log.note = t.value;
  if (t.id === 'admText') S.admin.text = t.value;
  if (t.dataset.sec !== undefined) S.data.sectors[+t.dataset.sec][t.dataset.f] = t.dataset.f==='id' ? t.value : +t.value;
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='pinInput') $('[data-action=unlock]').click(); });

function applyWeekends(on){
  const [y,m] = S.admin.month.split('-').map(Number);
  for (let d=1; d<=daysInMonth(y,m); d++){ const s = ymd(y,m,d); if (isWeekend(s)) on ? S.admin.days.add(s) : S.admin.days.delete(s); }
}
function doParse(keepMonth){
  const A = S.admin; const text = A.text || '';
  if (!keepMonth && !A.monthTouched){
    const dm = detectMonth(text);
    if (dm){ const now = new Date(); let y = now.getFullYear(); if (dm < now.getMonth()+1 - 1) y++; const k = monthKey(y, dm); if (k !== A.month){ A.month = k; } }
  }
  const [y,m] = A.month.split('-').map(Number);
  const r = parseDates(text, y, m);
  A.days = new Set(r.days); applyWeekends(A.weekends);
  const wd = r.days.filter(d=>!isWeekend(d)).length;
  A.parsedInfo = `${r.days.length} Tag(e) aus dem Text erkannt${r.ignored?` · ${r.ignored} Angabe(n) außerhalb von ${MONTH_NAMES[m-1]} ignoriert`:''}. Bitte kurz in der Vorschau prüfen.`;
  render();
}
function exportCSV(){
  const secs = S.data.sectors.map(s=>s.id);
  const rows = [['Datum','Person 1','Person 2',...secs,'Notiz']];
  for (const s of S.data.sessions.slice().sort((a,b)=>a.day<b.day?-1:1)) rows.push([fmtDate(s.day), s.person1||'', s.person2||'', ...secs.map(x=>s.sectors.includes(x)?'x':''), s.note||'']);
  const csv = '﻿' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'saugerteam-protokoll.csv'; a.click();
}

// ═══════════════════════════════════════════════════════════════
//  Start
// ═══════════════════════════════════════════════════════════════
function route(){ const h = location.hash.slice(1); S.tab = TABS.some(t=>t[0]===h) ? h : 'termine'; render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);
window.addEventListener('focus', softReload);
document.addEventListener('visibilitychange', () => { if (!document.hidden) softReload(); });

(async () => {
  route();
  try {
    if (DEMO) S.store = new LocalStore(); else { S.store = new SupaStore(); await withTimeout(S.store.init(), 15000, 'Zeitüberschreitung beim Laden (evtl. blockiert der Browser das Öffnen als lokale Datei – dann direkt online über GitHub Pages testen)'); }
    S.store.subscribe(softReload);
  } catch(e){ S.error = 'Supabase-Bibliothek konnte nicht geladen werden: ' + e.message; render(); return; }
  await reload();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
